<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Building the experience builder experience</title>
  <meta name="description"
        content="A presentation from DrupalSouth 2025">
  <meta name="author" content="Lee Rowlands">

  <link rel="stylesheet" href="dist/reset.css">
  <link rel="stylesheet" href="dist/reveal.css">
  <link rel="stylesheet" href="dist/theme/night.css">
  <link rel="stylesheet" href="dist/theme/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --pnx-dark-blue: #161b59;
      --pnx-background-color: transparent;
      --pnx-light-blue: #c8f1ff;
      --pnx-light-blue-opaque: #c8f1ffcc;
      --pnx-link: #0270b9;
      --pnx-link-hover: #161b59;
    }
    .cross {
      color: red;
    }
    .backgrounds .slide-background:first-child {
      background-image: url('./images/intro.svg');
    }
    .img--offscreen {
      position: absolute;
      right: 10%;
      bottom: 10%;
      display: block;
    }

    .reveal blockquote {
      box-shadow: none;
      position: relative;
    }
    .reveal blockquote:after {
      content: '❝';
      font-size: 4rem;
      position: absolute;
      top: 20px;
      left: -20px;
    }
    .check {
      color: green;
    }

    body {
      background-image: -webkit-gradient(
          linear,
          left top,
          left bottom,
          color-stop(0.48, #EBECF0),
          color-stop(0.67, #FFFFFF)
      );
      background-image: -o-linear-gradient(bottom, #EBECF0 48%, #FFFFFF 67%);
      background-image: -moz-linear-gradient(bottom, #EBECF0 48%, #FFFFFF 67%);
      background-image: -webkit-linear-gradient(bottom, #EBECF0 48%, #FFFFFF 67%);
      background-image: -ms-linear-gradient(bottom, #EBECF0 48%, #FFFFFF 67%);
      background-image: linear-gradient(to bottom, #EBECF0 48%, #FFFFFF 67%);
    }

    .backgrounds .slide-background {
      background-image: url('./images/background.png');
      background-size: cover;
    }

    .backgrounds .slide-background:first-child {
      /*background-image: url('./images/intro.svg');*/
    }

    .backgrounds .slide-background:nth-child(2) {
      background-image: url('./images/title-bg.png');
    }

    .reveal .controls .controls-arrow::after, .reveal .controls .controls-arrow::before {
      background-color: var(--pnx-dark-blue);
    }
    body .reveal {
      --r-heading-font: 'Roboto Mono',Helvetica,Arial,sans-serif;
      --r-selection-color: var(--pnx-dark-blue);
      --r-heading-font-weight: 700;
      --r-selection-background-color:  var(--pnx-dark-blue);
      --r-heading-color: var(--pnx-dark-blue);
      --r-link-color: var(--pnx-link);
      --r-link-color-hover: var(--pnx-link-hover);
      background-color: var(--pnx-background-color);
      color: var(--pnx-dark-blue);
    }

    }

    .reveal a:hover {
      background-color: var(--pnx-light-blue);
      outline: 0;
    }
    .reveal .credit {
      color: #fff;
      font-size: 16px !important;
    }

    img .reveal {
      max-height: 75%;
    }

    section[data-background] {
      background: var(--pnx-light-blue-opaque);
    }

    ul.tight li {
      padding: 0;
      margin: 0;
      font-size: 18px;
      line-height: 1.4em;
    }

    .twocol ul {
      columns: 2;
    }

    .underline {
      display: inline-block;
      position: relative;
      z-index: 1;
    }
    .underline::before {
      width: 100%;
      z-index: -1;
      height: 2rem;
      display: block;
      background-color: var(--pnx-light-blue);
      position: absolute;
      top: 1rem;
      content: "";
    }

    section.tall {
      height: 60%;
    }

    .small {
      font-size: 1.5rem;
    }
    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .middle {
      display: flex;
      align-items: center;
      justify-content: center;
    }
